name: "pimcore12-installation"

services:
    redis:
        image: "redis:alpine"
        command:
            - "redis-server"
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "volatile-lru"
            - "--save"
            - '""'
        volumes:
            - "redis-data:/data"

    db:
        image: "mariadb:10.11"
        working_dir: "/application"
        command:
            - "mysqld"
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_general_ci"
            - "--innodb-file-per-table=1"
            - "--lower-case-table-names=1"
        volumes:
            - "database:/var/lib/mysql"
        environment:
            MYSQL_ROOT_PASSWORD: "ROOT"
            MYSQL_DATABASE: "pimcore"
            MYSQL_USER: "pimcore"
            MYSQL_PASSWORD: "pimcore"

    adminer:
        image: "adminer"
        restart: "always"
        volumes:
            - ".docker/php/php-ini-overrides.ini:/usr/local/etc/php/conf.d/uploads.ini"
        ports:
            - "2001:8080"
        links:
            - "db:db"

    apache:
        image: "httpd:latest"
        ports:
            - "443:443"
        labels:
            - "dev.orbstack.domains=pimcore12.orb.local"
        volumes:
            - ".:/usr/local/apache2/htdocs:cached"
            - ".docker/apache2/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro"
        links:
            - "php"
        depends_on:
            - "db"
            - "redis"

    php:
        image: "pimcore/pimcore:php8.3-debug-latest"
        volumes:
            - "~/.composer:/root/composer"
            - ".:/var/www/html:cached"
            - "tmp-storage:/tmp:cached"
            - ".docker/php/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini"
        environment:
            COMPOSER_HOME: "/var/www/html"
            PHP_IDE_CONFIG: "serverName=localhost"
            PIMCORE_INSTALL_ADMIN_USERNAME: "admin"
            PIMCORE_INSTALL_ADMIN_PASSWORD: "admin"
            PIMCORE_INSTALL_MYSQL_HOST_SOCKET: "db"
            PIMCORE_INSTALL_MYSQL_PORT: 3306
            PIMCORE_INSTALL_MYSQL_USERNAME: "pimcore"
            PIMCORE_INSTALL_MYSQL_PASSWORD: "pimcore"
            PIMCORE_INSTALL_MYSQL_DATABASE: "pimcore"
        depends_on:
            - "db"
            - "redis"

    supervisord:
        image: "pimcore/pimcore:php8.3-supervisord-latest"
        volumes:
            - ".:/var/www/html:cached"
            - ".docker/supervisord.conf:/etc/supervisor/conf.d/pimcore.conf:ro"
        depends_on:
            - "db"

    opensearch:
        image: "opensearchproject/opensearch:2.18.0"
        environment:
            - "cluster.name=opensearch-cluster"
            - "node.name=opensearch"
            - "discovery.seed_hosts=opensearch"
            - "cluster.initial_cluster_manager_nodes=opensearch"
            - "indices.query.bool.max_clause_count=4096"
            - "bootstrap.memory_lock=true"
            - "action.auto_create_index=false"
            - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
            - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=Supe%long2?2Perfect"
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        volumes:
            - "opensearch-data:/usr/share/opensearch/data"
        ports:
            - "9200:9200"
            - "9600:9600"

#    opensearch-dashboards:
#        image: "opensearchproject/opensearch-dashboards:2.18.0"
#        ports:
#            - "5601:5601"
#        expose:
#            - "5601"
#        environment:
#            OPENSEARCH_HOSTS: '["https://opensearch.pimcore12-installation.orb.local:9200"]'


    mercure:
        image: "dunglas/mercure:latest"
        restart: "unless-stopped"
        environment:
            SERVER_NAME: ":80"
            MERCURE_PUBLISHER_JWT_KEY: ${JWT_KEY}
            MERCURE_SUBSCRIBER_JWT_KEY: ${JWT_KEY}
            MERCURE_EXTRA_DIRECTIVES: |-
                cors_origins "https://nginx.pimcore12-installation.orb.local"
        expose:
            - "80"
        volumes:
            - "mercure_data:/data"
            - "mercure_config:/config"

volumes:
    database:
    redis-data:
    tmp-storage:
    opensearch-data:
    mercure_data:
    mercure_config:
