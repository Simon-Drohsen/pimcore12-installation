services:
    redis:
        image: redis:alpine
        command: [ redis-server, --maxmemory 128mb, --maxmemory-policy volatile-lru, --save "" ]

    rabbitmq:
        image: rabbitmq:alpine
        volumes:
            - pimcore-rabbitmq:/var/lib/rabbitmq/

    db:
        image: mariadb:10.11
        working_dir: /application
        command: [ mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_520_ci, --innodb-file-per-table=1 ]
        volumes:
            - pimcore-database:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=ROOT
            - MYSQL_DATABASE=pimcore
            - MYSQL_USER=pimcore
            - MYSQL_PASSWORD=pimcore
        healthcheck:
            # The service is considered healthy when:
            # - connection to pimcore db can be established, and
            # - we can run a simple SQL query.
            test: [ "CMD-SHELL", "mysql -h db -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SHOW TABLES;'" ]
            interval: 10s
            retries: 6
            start_period: 1m
            timeout: 3s

    nginx:
        image: nginx:stable-alpine
        ports:
            - "443:443"
        volumes:
            - .:/var/www/html:ro
            - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    php:
        #user: '1000:1000' # set to your uid:gid
        image: pimcore/pimcore:php8.3-debug-latest
        environment:
            COMPOSER_HOME: /var/www/html
            PHP_IDE_CONFIG: serverName=localhost
            # Feed installer configuration via ENV variables.
            # See: https://pimcore.com/docs/pimcore/current/Development_Documentation/Getting_Started/Advanced_Installation_Topics.html#page_Advanced-Installation-Topics
            PIMCORE_INSTALL_MYSQL_USERNAME: pimcore
            PIMCORE_INSTALL_MYSQL_PASSWORD: pimcore
            PIMCORE_INSTALL_MYSQL_PORT: 3306
            PIMCORE_INSTALL_MYSQL_HOST_SOCKET: db
            PIMCORE_INSTALL_MYSQL_DATABASE: pimcore
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - .:/var/www/html
            - ./.docker/messenger.yaml:/var/www/html/config/packages/messenger.yaml:ro

    supervisord:
        #user: '1000:1000' # set to your uid:gid
        image: pimcore/pimcore:php8.3-supervisord-latest
        depends_on:
            rabbitmq:
                condition: service_started
            db:
                condition: service_healthy
        volumes:
            - .:/var/www/html
            - ./.docker/messenger.yaml:/var/www/html/config/packages/messenger.yaml:ro
            - ./.docker/supervisord.conf:/etc/supervisor/conf.d/pimcore.conf:ro

    adminer:
        image: adminer
        restart: 'always'
        volumes:
            - '.docker/php/php-ini-overrides.ini:/usr/local/etc/php/conf.d/uploads.ini'
        ports:
            - '2001:8080'
        links:
            - db:db

    opensearch:
        image: "opensearchproject/opensearch:2.18.0"
        environment:
            - "cluster.name=opensearch-cluster"
            - "node.name=opensearch"
            - "discovery.seed_hosts=opensearch"
            - "cluster.initial_cluster_manager_nodes=opensearch"
            - "indices.query.bool.max_clause_count=4096"
            - "bootstrap.memory_lock=true"
            - "action.auto_create_index=false"
            - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
            - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=Supe%long2?2Perfect"
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        volumes:
            - "opensearch-data:/usr/share/opensearch/data"
        ports:
            - "9200:9200"
            - "9600:9600"

    opensearch-dashboards:
        image: "opensearchproject/opensearch-dashboards:2.18.0"
        ports:
            - "5601:5601"
        expose:
            - "5601"
        environment:
            OPENSEARCH_HOSTS: '["https://opensearch.pimcore12-installation.orb.local:9200"]'


    mercure:
        image: dunglas/mercure:latest
        restart: unless-stopped
        environment:
            # Disable HTTPS
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: ${JWT_KEY}
            MERCURE_SUBSCRIBER_JWT_KEY: ${JWT_KEY}
            MERCURE_EXTRA_DIRECTIVES: |-
                cors_origins "https://nginx.pimcore12-installation.orb.local"
        expose:
            - "80"
        volumes:
            - mercure_data:/data
            - mercure_config:/config

volumes:
    pimcore-database:
    pimcore-rabbitmq:
    opensearch-data:
    mercure_data:
    mercure_config:
